version: 2
updates:
  # Minor and patch updates come as one weekly PR; a major update gets a PR of
  # its own, since it can break the build.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that are upgraded on purpose, on their own branch:
    # - @types/node follows the Node major of .nvmrc, engines and Vercel (24)
    # - eslint 10 waits for its plugins (context/todo.md, "Tooling")
    # - typescript waits for typescript-eslint, whose peer range ends below 6.1
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
