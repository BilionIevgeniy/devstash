name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. On main every run finishes, so
# every merged commit has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job names `ci`, `integration` and `e2e` are the checks that branch
  # protection on main requires.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every variable here is a dummy: CI never connects to a database or a
    # vendor, and no GitHub secret is used.
    # - DATABASE_URL: src/lib/prisma.ts throws at import when it is unset. The
    #   pg adapter connects only on a query, and no page queries at build time
    #   (the pages that read data are dynamic).
    # - DIRECT_URL: prisma.config.ts reads it for `prisma generate` (in
    #   `npm ci` through postinstall, and in the build). Never connected.
    # - AUTH_SECRET, APP_URL: read by NextAuth and the email links.
    # Not set: vendor keys (Stripe, R2, Resend, Upstash, OpenAI, GitHub OAuth),
    # read only when a request comes in; NEXT_PUBLIC_MONACO_VS_PATH, set by
    # next.config.ts from package.json. The build fetches the Google Fonts of
    # next/font, the only network access it needs.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The integration tests: the app's Prisma on a real Postgres, so a `where`
  # without `userId` fails a test. Runs beside `ci`, on every PR.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The test database is the only real service: a Postgres container of the
    # same major version as Neon, created empty for this run and thrown away
    # after it. It takes connections without a password (trust): it is reached
    # only from this runner, and a URL with no password is no secret to a
    # scanner. No GitHub secret is used.
    # - TEST_DATABASE_URL: read by vitest.integration.config.mts, refused by
    #   requireTestDatabase unless the host is local.
    # - DATABASE_URL, DIRECT_URL: the same database. prisma.config.ts reads
    #   DIRECT_URL for `prisma generate` in `npm ci`; the tests hand both to
    #   Prisma themselves.
    # Upstash, R2, Resend, Stripe, OpenAI and GitHub are mocked in
    # test/integration/setup.ts, so none of their keys is set.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: devstash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devstash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/devstash_test
      DATABASE_URL: postgresql://postgres@localhost:5432/devstash_test
      DIRECT_URL: postgresql://postgres@localhost:5432/devstash_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # The end-to-end tests: Playwright drives Chromium against the production
  # build (`npm run build`, `npm run start`, started by playwright.config.ts) on
  # a real Postgres. Runs after `ci`, so a red lint or build does not also pay
  # for a browser.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same empty Postgres as the `integration` job, in a container of its
    # own: both jobs empty their database, so they cannot share one.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: devstash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devstash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # - TEST_DATABASE_URL: read by playwright.config.ts, refused by
    #   requireTestDatabase unless the host is local.
    # - DATABASE_URL, DIRECT_URL: the same database. prisma.config.ts reads
    #   DIRECT_URL for `prisma generate` in `npm ci`. The test server gets an
    #   environment of its own (scripts/e2e-server-env.ts), with dummies for
    #   Stripe, Resend, OpenAI, R2 and GitHub.
    # - E2E_UPSTASH_REDIS_REST_URL, E2E_UPSTASH_REDIS_REST_TOKEN: the only
    #   secrets of this workflow, set on the one step that runs the tests and
    #   not on the job: `npm ci` runs the install scripts of every dependency,
    #   and this repository is public. Sign-in is rate-limited and fails closed,
    #   so the production build needs a real Upstash database. The free plan
    #   allows one, so it is the app's own: the test keys never meet a user's (a
    #   random email and a random test IP per run). GitHub passes no Actions
    #   secrets to a fork PR and only Dependabot's own to a Dependabot PR, so
    #   the same two are stored as Dependabot secrets too.
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/devstash_test
      DATABASE_URL: postgresql://postgres@localhost:5432/devstash_test
      DIRECT_URL: postgresql://postgres@localhost:5432/devstash_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
          E2E_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
      # The HTML report embeds the traces of the failed tests and of those that
      # failed once and passed on the retry, so it is kept in both cases.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
